name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Контрактные тесты хранилища гоняются по настоящему PostgreSQL, а не по
    # его подобию: в памяти атомарность получается сама собой, а здесь её
    # обеспечивают ограничения схемы и блокировки строк — это и надо проверять.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: botdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d botdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://bot:bot@127.0.0.1:5432/botdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Interface texts
        run: python scripts/check_texts.py

      - name: Tests
        run: pytest -q
