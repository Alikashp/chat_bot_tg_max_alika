[project]
name = "chat-bot-tg-max"
version = "0.1.0"
description = "Chat and image bot for Telegram and MAX messengers"
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiogram==3.31.0",
    "aiohttp>=3.13,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<0.24",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit (security)
    "T20",       # no print
    "TID",       # tidy imports
]
ignore = [
    "S101",      # assert is fine in tests
    # Comments and docstrings are Russian by project convention, so the
    # "ambiguous unicode character" rules fire on every Cyrillic letter.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Strict mode on the business-logic layers, per the brief (section 3.1).
[[tool.mypy.overrides]]
module = ["app.core.*", "app.ports.*"]
strict = true
disallow_any_explicit = true
